name: Build MEAnalyzer for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows.yaml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download upstream MEAnalyzer
        shell: pwsh
        run: |
          $version = "1.312.0-r378"
          $url = "https://github.com/platomav/MEAnalyzer/archive/refs/tags/v$version.zip"

          Invoke-WebRequest $url -OutFile source.zip
          Expand-Archive source.zip -DestinationPath source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install colorama crccheck pltable pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          $source = Get-ChildItem source -Directory |
            Select-Object -First 1

          python -m PyInstaller `
            --clean `
            --onefile `
            --name MEAnalyzer `
            "$($source.FullName)\MEA.py"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MEAnalyzer-Windows
          path: dist/MEAnalyzer.exe
